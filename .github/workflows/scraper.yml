name: Bot Rastreador Diario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python scraper.py
      - run: |
          git config --global user.name "Bot-RRHH"
          git config --global user.email "bot@github.com"
          git add vacantes.json
          git commit -m "🤖 Actualización de vacantes" || exit 0
          git push
