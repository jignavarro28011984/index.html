<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avanzar RH - Diagnóstico Rápido</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 12px;
            color: #0f172a;
        }
        .card-container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 1px solid #cbd5e1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .brand { font-size: 20px; font-weight: bold; color: #005580; margin: 0; }
        .tag { background: #fef3c7; color: #b45309; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 10px; }
        
        .hero-mini {
            background: linear-gradient(135deg, #005580 0%, #002244 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.35;
            margin-bottom: 15px;
        }
        .hero-mini strong { color: #fef3c7; }

        .survey-title {
            font-size: 13px;
            font-weight: bold;
            color: #005580;
            margin-bottom: 12px;
            display: block;
        }

        /* Botones de Selección / Encuesta */
        .option-item {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-item:active { background: #e0f2fe; border-color: #005580; }
        .option-item input { margin-right: 12px; width: 18px; height: 18px; accent-color: #005580; }
        .option-text strong { display: block; font-size: 13px; color: #0f172a; }
        .option-text span { font-size: 11px; color: #64748b; }

        .btn-wsp {
            display: block;
            width: 100%;
            background: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 14px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            border: none;
            box-shadow: 0 4px 10px rgba(37,211,102,0.3);
            cursor: pointer;
        }
        .footer-sub { text-align: center; font-size: 10.5px; color: #94a3b8; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <h1 class="brand">Avanzar RH</h1>
            <span class="tag">Asistente de Consulta</span>
        </div>

        <div class="hero-mini">
            <strong>¿Qué desafío querés resolver hoy en tu empresa?</strong><br>
            Seleccioná una o más opciones y coordinemos en 1 minuto.
        </div>

        <span class="survey-title">👇 Marque lo que necesita consultar:</span>

        <form id="surveyForm">
            <label class="option-item">
                <input type="checkbox" name="service" value="Capacitación e Inteligencia Artificial">
                <div class="option-text">
                    <strong>🎓 Capacitación e IA Aplicada</strong>
                    <span>Talleres prácticos y automatización para mandos medios</span>
                </div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="service" value="Selección por Competencias">
                <div class="option-text">
                    <strong>👥 Selección de Personal con Garantía</strong>
                    <span>Incorporación de perfiles con 90 días de cobertura</span>
                </div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="service" value="Eficiencia, KPIs y Salarios">
                <div class="option-text">
                    <strong>📊 Eficiencia, KPIs & Remuneración Variable</strong>
                    <span>Estructuración de salarios por objetivos y tableros de control</span>
                </div>
            </label>

            <label class="option-item">
                <input type="checkbox" name="service" value="Diagnóstico de Clima Organizacional">
                <div class="option-text">
                    <strong>🔍 Diagnóstico General de Equipo</strong>
                    <span>Visita in-site para evaluar procesos y clima laboral</span>
                </div>
            </label>

            <button type="button" class="btn-wsp" onclick="sendToWhatsApp()">
                💬 Enviar Consulta por WhatsApp
            </button>
        </form>

        <div class="footer-sub">
            Lic. Noelia Gorgerino | www.avanzargestionhumana.com
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            const checkboxes = document.querySelectorAll('input[name="service"]:checked');
            let selected = [];
            checkboxes.forEach((cb) => { selected.push(cb.value); });

            let message = "Hola Noelia, de Avanzar RH me interesa:";
            if (selected.length > 0) {
                message += "\n- " + selected.join("\n- ");
            } else {
                message += " solicitar información general sobre sus servicios.";
            }

            // Número oficial de Avanzar RH (+598 99 343 810)
            const phone = "59899343810";
            const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
            window.location.href = url;
        }
    </script>
</body>
</html>
